[defaults]
inventory = inventory/hosts.yml
# Resolved against the CWD — always run from infra/ansible (see README).
roles_path = roles
# Fresh/rebuilt OCI instances change host keys; the VCN security list +
# sshd hardening are the real perimeter here.
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
gathering = smart

# Intentionally no vault_password_file: pass --vault-password-file or -v.

[ssh_connection]
pipelining = True

---
- name: Validate sshd config
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: restarted

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

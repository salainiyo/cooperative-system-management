services:
  # 1. THE NEW FRONT DOOR (Caddy)
  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: cooperative_redis
    restart: unless-stopped

  # 3. THE DATABASE (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: cooperative_postgres
    environment:
      POSTGRES_USER: coop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coop_secret}
      POSTGRES_DB: coop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coop -d coop"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    image: alains04/coop-backend:latest
    container_name: cooperative_backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://coop:${POSTGRES_PASSWORD:-coop_secret}@postgres:5432/coop
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: alains04/coop-frontend:latest
    container_name: cooperative_frontend
    # We REMOVE the ports here because Caddy will talk to it internally
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  postgres_data: # PostgreSQL data volume